apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-messaging
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agent-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
spec:
  replicas: {{ .Values.messaging.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/component: messaging
      {{- include "agent-mesh.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: messaging
        {{- include "agent-mesh.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: messaging
          image: "{{ .Values.messaging.image.repository }}:{{ .Values.messaging.image.tag }}"
          imagePullPolicy: {{ .Values.messaging.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_BUSINESS_ADDR
              value: ":8080"
            - name: IDENTITY_GRPC_ADDR
              value: "{{ .Release.Name }}-identity:{{ .Values.identity.grpcPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secret
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.messaging.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-messaging
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agent-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
spec:
  selector:
    app.kubernetes.io/component: messaging
    {{- include "agent-mesh.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
