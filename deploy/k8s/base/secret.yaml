# 本地 k3d 开发用的占位 Secret。生产 overlay 会换成 ExternalSecret，
# 从 Vault / AWS Secrets Manager 等来源取值。
#
# 这里的 DSN 假设宿主机跑着 dev compose，通过 k3d 的特殊 DNS 名
# "host.k3d.internal" 访问。未来加了 DB overlay 后，换成集群内
# StatefulSet 的地址即可。
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
type: Opaque
stringData:
  # mysql driver 格式：user:pass@tcp(host:port)/db?options
  MYSQL_DSN: "mesh:dev_mesh_pw@tcp(host.k3d.internal:3308)/agent_mesh?parseTime=true"
  REDIS_ADDR: "host.k3d.internal:6381"
  REDIS_PASSWORD: ""
  # 最少 16 字节；生产 overlay 里换成真正的随机密钥。
  JWT_SECRET: "dev_jwt_secret_local_k3d_only"
