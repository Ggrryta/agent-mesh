# Hugo 博客部署到 GitHub Pages
#
# 当 blog/ 目录有变更并推送到 main 时自动构建部署。
# 也可手动触发（workflow_dispatch）。
#
# 前提：
#   仓库 Settings → Pages → Source 设为 "GitHub Actions"

name: deploy-blog

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - ".github/workflows/deploy-blog.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.139.0"
          extended: true

      - name: Build
        working-directory: blog
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
