version: "2"

run:
  go: '1.25'
  timeout: 5m
  tests: true

# v2 格式:linters 是顶层字段,不是嵌套在 linters.enable 下
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell

  exclusions:
    paths:
      - vendor
      - frontend
      - test/e2e
      - test/integration
    rules:
      - path: _test\.go
        linters:
          - unused
      - path: \.pb\.go$
        linters:
          - all
